services:
  postgres:
    image: postgres:16-alpine
    container_name: recipes-postgres
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: recipes
      POSTGRES_PASSWORD: recipes
      POSTGRES_DB: postgres
    volumes:
      - recipes_pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U recipes']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  recipes_pg_data:
